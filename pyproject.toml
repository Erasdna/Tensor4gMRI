[build-system]
requires = ["setuptools>=64.4.0", "wheel", "pip>=22.3"]
build-backend = "setuptools.build_meta"

[project]
name = "Tensor4gMRI"
version = "1.0.0"
    requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib",
    "numpy",
    "scipy",
    "pandas[output-formatting]",
    "tensorly",
    "nibabel",
    "h5py>=3.16.0",
    "scienceplots>=2.2.1",
    "tlviz>=0.1.1",
    "scikit-learn>=1.7.2",
    "snakefmt>=0.10.3",
    "snakemake<9.17.0",
    "seaborn>=0.13.2",
    "statannotations>=0.7.2",
    "imageio>=2.37.3",
    "gmritensor",
    "pyarrow",
]


[project.optional-dependencies]
dev = [
    "pdbpp",
    "pytest",
    "bump-my-version",
    "pre-commit",
]
docs = [
    "jupyter-book",
    "jupytext",
    "sphinxcontrib-bibtex",
]
all=["Tensor4gMRI[dev,docs]"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
pythonpath = ["code"]
testpaths = ["tests"]

[tool.mypy]
mypy_path = "code"
explicit_package_bases = true
ignore_missing_imports = true

[tool.ruff]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = ["E", "F"]
ignore = ["E402", "E741", "E731", "E743"]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["A", "B", "C", "D", "E", "F"]
unfixable = []

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "code/CP/old",
    "code/old"
]

# Same as Black.
line-length = 100

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Assume Python 3.10.
target-version = "py310"

[tool.ruff.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10


[tool.bumpversion]
allow_dirty = false
commit = true
message = "Bump version: {current_version} → {new_version}"
tag = true
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
current_version = "1.2.0"


[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "CITATION.cff"
search = """
title: "CP analysis of gMRI data"
version: {current_version}
"""
replace = """
title: "CP analysis of gMRI data"
version: {new_version}
"""

[tool.uv.sources]
gmritensor = { git = "https://github.com/Erasdna/gMRI-tensor.git", branch = "feature/roi-overview" }
